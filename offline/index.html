<!DOCTYPE html>
<html>
	<head>
		<title> Autochess offline </title>
		<link rel="icon" href="./favicon.ico" type="image/x-icon">
		<meta name="viewport" content="width=device-width, initial-scale=0.85, user-scalable=no">
		<script type="module" src="./main.ts"></script>

		<style>
			body, html {
				margin: 0;

	</head>
